apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: sdd-blog-cms
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sdd-blog-cms
spec:
  replicas: 1
  # PVC é ReadWriteOnce: nunca ter 2 pods montando o mesmo volume ao mesmo
  # tempo durante um rollout — espera o pod antigo morrer antes de subir o novo.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # AOF: Redis aqui é fila de jobs (SPEC-003), não só cache — perder
          # o AOF em restart perderia jobs `pending` enfileirados.
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sdd-blog-cms
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
