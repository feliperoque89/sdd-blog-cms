# GKE: usa o controller de Ingress nativo do Google Cloud (classe `gce`,
# já embutido no cluster — nada a instalar). Ele provisiona um HTTP(S) Load
# Balancer real do GCP e cria os backends via NEG (ver anotação
# `cloud.google.com/neg` nos Services em 05-minio.yaml, 06-backend.yaml e
# 08-frontend.yaml).
#
# Pré-requisito (uma vez só): reservar um IP externo estático global e
# referenciar o nome dele abaixo, senão o LB sobe com IP efêmero:
#   gcloud compute addresses create sdd-blog-cms-ip --global
#
# O addon HttpLoadBalancing normalmente já registra a IngressClass `gce`
# sozinho — mas em alguns clusters ela não aparece (`kubectl get
# ingressclass` vazio), e nesse caso o Ingress abaixo fica com
# `ingressClassName` apontando pra uma classe inexistente: o controller
# nem tenta reconciliar (sem eventos, sem NEGs, sem erro claro — só
# "Missing one or more resources" no Console). Garantimos a classe aqui
# pra não depender desse comportamento implícito.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: gce
  annotations:
    ingressclass.kubernetes.io/is-default-class: "false"
spec:
  controller: k8s.io/ingress-gce
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sdd-blog-cms
  namespace: sdd-blog-cms
  annotations:
    kubernetes.io/ingress.global-static-ip-name: sdd-blog-cms-ip
spec:
  ingressClassName: gce
  # Sem `host:` de propósito — sem domínio real (conta de teste), serve
  # direto pelo IP externo do Load Balancer. Se um domínio real for
  # apontado pra esse IP no futuro, reintroduza `host: seu-dominio.com`
  # em cada regra abaixo.
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Serve o bucket "media" (MEDIA_STORAGE_BUCKET, ver 01-configmap.yaml)
          # direto do MinIO — sem rewrite, GCE Ingress encaminha o path como
          # veio, e /media/<key> já é a URL nativa do bucket "media" no MinIO.
          # Requer o bucket com download anônimo liberado (ver README).
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
