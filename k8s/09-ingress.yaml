# Requer um Ingress controller instalado no cluster (ex.: ingress-nginx) —
# não incluso aqui, é infraestrutura do cluster, não da aplicação.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sdd-blog-cms
  namespace: sdd-blog-cms
spec:
  ingressClassName: nginx
  rules:
    - host: blog.local # ajuste para o domínio real em produção
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
