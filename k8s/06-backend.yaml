apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sdd-blog-cms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Build local (kind/minikube): docker/backend.Dockerfile. Em
          # produção (GKE), aponta pro Artifact Registry — tag `latest` fixa
          # + `imagePullPolicy: Always` pra não precisar editar o manifest a
          # cada rebuild, só `docker push ...:latest` e
          # `kubectl rollout restart deploy/backend deploy/worker -n sdd-blog-cms`.
          image: us-central1-docker.pkg.dev/ssd-blog-cms/sdd-blog-cms/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: sdd-blog-cms
  annotations:
    # Container-native load balancing: necessário pro Ingress do GKE
    # (09-ingress.yaml) enxergar este Service, já que ele roteia /api pra cá.
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
