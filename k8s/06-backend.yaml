apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sdd-blog-cms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Build local (kind/minikube): docker/backend.Dockerfile. Em
          # produção, substitua pela imagem publicada num registry (ex.:
          # ghcr.io/<org>/sdd-blog-cms-backend:<tag>), nunca `:local`.
          image: sdd-blog-cms-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: sdd-blog-cms
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
