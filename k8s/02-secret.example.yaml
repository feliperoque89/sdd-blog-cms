# TEMPLATE — valores de exemplo, NUNCA use em produção.
#
# Para uso real: copie este arquivo para `k8s/secret.yaml` (já listado no
# `.gitignore` da raiz do repo, nunca commitado) e substitua os valores, ou
# gere os Secrets diretamente via `kubectl create secret generic ... \
# --from-literal=CHAVE=valor` / um gerenciador externo (Sealed Secrets,
# External Secrets Operator, Vault etc.) em vez de manter YAML com segredos
# em disco.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: sdd-blog-cms
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "CHANGE_ME"
  MYSQL_DATABASE: "blog"
  MYSQL_USER: "blog"
  MYSQL_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: sdd-blog-cms
type: Opaque
stringData:
  MINIO_ROOT_USER: "CHANGE_ME"
  MINIO_ROOT_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: sdd-blog-cms
type: Opaque
stringData:
  # Precisa bater com MYSQL_USER/MYSQL_PASSWORD/MYSQL_DATABASE acima —
  # driver assíncrono `asyncmy` (ver specs/ARCHITECTURE.md).
  DATABASE_URL: "mysql+asyncmy://blog:CHANGE_ME@mysql:3306/blog"
  # Gere com: openssl rand -hex 32
  JWT_SECRET: "CHANGE_ME"
  LLM_API_KEY: "CHANGE_ME"
