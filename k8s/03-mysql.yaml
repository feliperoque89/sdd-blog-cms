apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: sdd-blog-cms
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-secrets
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          # tcpSocket em vez de exec+senha: a imagem oficial só abre a porta
          # 3306 depois de terminar a inicialização (o script de init roda
          # num servidor temporário só-socket) — a porta aberta já é sinal
          # suficiente de "pronto", sem precisar passar credenciais à probe.
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              # 250m não cabia em nenhum nó individual do cluster de 3x
              # e2-medium (~940m alocável/nó, já dividido entre os outros
              # componentes) — mysql-0 ficava Pending pra sempre mesmo com
              # CPU livre agregada no cluster. limits continua em 1 vCPU
              # pra picos de query, só a requisição de agendamento caiu.
              cpu: 150m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: sdd-blog-cms
spec:
  # Headless — StatefulSet de réplica única, backend resolve `mysql` via DNS
  # interno do cluster (ver DATABASE_URL em 02-secret.example.yaml).
  clusterIP: None
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
